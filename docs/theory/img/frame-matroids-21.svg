<text x="400" y="294" text-anchor="end" dy=".35em" font-size="14" font-weight="bold" fill="#111111">Frame 0 (even)</text>
<text x="440" y="112" text-anchor="start" dy=".35em" font-size="14" font-weight="bold" fill="#111111">In frame 1, 4 and 9 are factors</text>
<text x="440" y="138" text-anchor="start" dy=".35em" font-size="13" font-weight="normal" fill="#666666">Unit vectors e₄ and e₉.  The moves span</text>
<text x="440" y="156" text-anchor="start" dy=".35em" font-size="13" font-weight="normal" fill="#666666">e₄ + e₆ and e₆ + e₉, so 4 and 9 have</text>
<text x="440" y="174" text-anchor="start" dy=".35em" font-size="13" font-weight="normal" fill="#666666">the same class in frame 1: rank 1.</text>
<text x="440" y="322" text-anchor="start" dy=".35em" font-size="14" font-weight="bold" fill="#111111">In frame 0, they are movers</text>
<text x="440" y="348" text-anchor="start" dy=".35em" font-size="13" font-weight="normal" fill="#666666">Vectors e₂ and e₃.  The moves span</text>
<text x="440" y="366" text-anchor="start" dy=".35em" font-size="13" font-weight="normal" fill="#666666">e₂ + e₇ and e₃ + e₇, so 4 and 9 have</text>
<text x="440" y="384" text-anchor="start" dy=".35em" font-size="13" font-weight="normal" fill="#666666">the same class in frame 0: rank 1.</text>
<text x="390" y="458" text-anchor="middle" dy=".35em" font-size="12" font-weight="normal" fill="#666666">Dashed arrow: a candidate to the maximal factor that would pay for it in the frame in front.</text>
