<polygon points="110,384.5 105.4,373.5 114.6,373.5" fill="#666666"/>
<line x1="278" y1="210" x2="278" y2="375.5" stroke="#666666" stroke-width="1.5" fill="none" stroke-dasharray="6 4"/>
