<text x="390" y="456" text-anchor="middle" dy=".35em" font-size="12" font-weight="normal" fill="#666666">Dotted double arrows: 20 = 2²·5 ↔ 28 = 2²·7 and 10 = 2·5 ↔ 14 = 2·7.</text>
