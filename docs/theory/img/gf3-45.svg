<svg xmlns="http://www.w3.org/2000/svg" width="780" height="500" viewBox="0 0 780 500" font-family="Helvetica, Arial, sans-serif" font-size="14">
<title>The five numbers 12, 18, 20, 30 and 45 as members joined to the factors 4, 6, 9, 10 and 15, with a value of 1 or 2 on each edge so that the values at every factor add up to 0 modulo 3.</title>
