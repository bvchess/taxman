<line x1="419.8" y1="220.6" x2="419.8" y2="291.4" stroke="#666666" stroke-width="1.4" fill="none"/>
<line x1="408.7" y1="322.1" x2="369" y2="376.8" stroke="#666666" stroke-width="1.4" fill="none"/>
<line x1="342.1" y1="396.3" x2="275.4" y2="418" stroke="#666666" stroke-width="1.4" fill="none"/>
<line x1="244.6" y1="418" x2="177.9" y2="396.3" stroke="#666666" stroke-width="1.4" fill="none"/>
<line x1="151" y1="376.8" x2="111.3" y2="322.1" stroke="#666666" stroke-width="1.4" fill="none"/>
<line x1="100.2" y1="291.4" x2="100.2" y2="220.6" stroke="#666666" stroke-width="1.4" fill="none"/>
<line x1="110.5" y1="188.9" x2="150.2" y2="134.3" stroke="#666666" stroke-width="1.4" fill="none"/>
<line x1="176.7" y1="114.1" x2="243.4" y2="92.4" stroke="#666666" stroke-width="1.4" fill="none"/>
<line x1="348.5" y1="376.8" x2="172.3" y2="134.3" stroke="#666666" stroke-width="1.4" fill="none"/>
<circle cx="260" cy="87" r="16" fill="#ffffff" stroke="#111111" stroke-width="1.7"/>
<text x="260" y="87" text-anchor="middle" dy=".35em" font-size="14" font-weight="normal" fill="#111111">12</text>
<rect x="344.7" y="105.1" width="28" height="28" fill="#ffffff" stroke="#111111" stroke-width="1.7"/>
<text x="358.7" y="119.1" text-anchor="middle" dy=".35em" font-size="14" font-weight="normal" fill="#111111">4</text>
<circle cx="419.8" cy="203.1" r="16" fill="#ffffff" stroke="#111111" stroke-width="1.7"/>
<text x="419.8" y="203.1" text-anchor="middle" dy=".35em" font-size="14" font-weight="normal" fill="#111111">20</text>
<rect x="405.8" y="292.9" width="28" height="28" fill="#ffffff" stroke="#111111" stroke-width="1.7"/>
<text x="419.8" y="306.9" text-anchor="middle" dy=".35em" font-size="14" font-weight="normal" fill="#111111">10</text>
<circle cx="358.7" cy="390.9" r="16" fill="#ffffff" stroke="#111111" stroke-width="1.7"/>
<text x="358.7" y="390.9" text-anchor="middle" dy=".35em" font-size="14" font-weight="normal" fill="#111111">30</text>
<rect x="246" y="409" width="28" height="28" fill="#ffffff" stroke="#111111" stroke-width="1.7"/>
<text x="260" y="423" text-anchor="middle" dy=".35em" font-size="14" font-weight="normal" fill="#111111">15</text>
<circle cx="161.3" cy="390.9" r="16" fill="#ffffff" stroke="#111111" stroke-width="1.7"/>
<text x="161.3" y="390.9" text-anchor="middle" dy=".35em" font-size="14" font-weight="normal" fill="#111111">45</text>
<rect x="86.2" y="292.9" width="28" height="28" fill="#ffffff" stroke="#111111" stroke-width="1.7"/>
<text x="100.2" y="306.9" text-anchor="middle" dy=".35em" font-size="14" font-weight="normal" fill="#111111">9</text>
<circle cx="100.2" cy="203.1" r="16" fill="#ffffff" stroke="#111111" stroke-width="1.7"/>
<text x="100.2" y="203.1" text-anchor="middle" dy=".35em" font-size="14" font-weight="normal" fill="#111111">18</text>
<rect x="147.3" y="105.1" width="28" height="28" fill="#ffffff" stroke="#111111" stroke-width="1.7"/>
<text x="161.3" y="119.1" text-anchor="middle" dy=".35em" font-size="14" font-weight="normal" fill="#111111">6</text>
<circle cx="309.4" cy="103" r="10" fill="#ffffff" stroke="#111111" stroke-width="1.5"/>
<text x="309.4" y="103" text-anchor="middle" dy=".35em" font-size="11" font-weight="bold" fill="#111111">1</text>
<circle cx="389.3" cy="161.1" r="10" fill="#ffffff" stroke="#111111" stroke-width="1.5"/>
<text x="389.3" y="161.1" text-anchor="middle" dy=".35em" font-size="11" font-weight="bold" fill="#111111">2</text>
<circle cx="419.8" cy="255" r="10" fill="#ffffff" stroke="#111111" stroke-width="1.5"/>
<text x="419.8" y="255" text-anchor="middle" dy=".35em" font-size="11" font-weight="bold" fill="#111111">1</text>
<circle cx="389.3" cy="348.9" r="10" fill="#ffffff" stroke="#111111" stroke-width="1.5"/>
<text x="389.3" y="348.9" text-anchor="middle" dy=".35em" font-size="11" font-weight="bold" fill="#111111">2</text>
<circle cx="309.4" cy="407" r="10" fill="#ffffff" stroke="#111111" stroke-width="1.5"/>
<text x="309.4" y="407" text-anchor="middle" dy=".35em" font-size="11" font-weight="bold" fill="#111111">1</text>
<circle cx="210.6" cy="407" r="10" fill="#ffffff" stroke="#111111" stroke-width="1.5"/>
<text x="210.6" y="407" text-anchor="middle" dy=".35em" font-size="11" font-weight="bold" fill="#111111">2</text>
<circle cx="130.7" cy="348.9" r="10" fill="#ffffff" stroke="#111111" stroke-width="1.5"/>
<text x="130.7" y="348.9" text-anchor="middle" dy=".35em" font-size="11" font-weight="bold" fill="#111111">2</text>
<circle cx="100.2" cy="255" r="10" fill="#ffffff" stroke="#111111" stroke-width="1.5"/>
<text x="100.2" y="255" text-anchor="middle" dy=".35em" font-size="11" font-weight="bold" fill="#111111">1</text>
<circle cx="130.7" cy="161.1" r="10" fill="#ffffff" stroke="#111111" stroke-width="1.5"/>
<text x="130.7" y="161.1" text-anchor="middle" dy=".35em" font-size="11" font-weight="bold" fill="#111111">1</text>
<circle cx="210.6" cy="103" r="10" fill="#ffffff" stroke="#111111" stroke-width="1.5"/>
<text x="210.6" y="103" text-anchor="middle" dy=".35em" font-size="11" font-weight="bold" fill="#111111">1</text>
<circle cx="299.5" cy="309.4" r="10" fill="#ffffff" stroke="#111111" stroke-width="1.5"/>
<text x="299.5" y="309.4" text-anchor="middle" dy=".35em" font-size="11" font-weight="bold" fill="#111111">1</text>
<text x="390" y="26" text-anchor="middle" dy=".35em" font-size="15" font-weight="bold" fill="#111111">The odd core {12, 18, 20, 30, 45} with a signing over GF(3)</text>
<text x="390.5" y="94.8" text-anchor="middle" dy=".35em" font-size="13" font-weight="normal" fill="#111111">1 + 2 = 0</text>
<text x="129.5" y="94.8" text-anchor="middle" dy=".35em" font-size="13" font-weight="normal" fill="#111111">1 + 1 + 1 = 0</text>
<text x="48.9" y="316.2" text-anchor="middle" dy=".35em" font-size="13" font-weight="normal" fill="#111111">1 + 2 = 0</text>
<text x="471.1" y="316.2" text-anchor="middle" dy=".35em" font-size="13" font-weight="normal" fill="#111111">1 + 2 = 0</text>
<text x="260" y="453" text-anchor="middle" dy=".35em" font-size="13" font-weight="normal" fill="#111111">1 + 2 = 0</text>
<text x="615" y="150" text-anchor="middle" dy=".35em" font-size="13" font-weight="normal" fill="#111111">Each edge carries the entry that</text>
<text x="615" y="168" text-anchor="middle" dy=".35em" font-size="13" font-weight="normal" fill="#111111">its member has at that factor.</text>
<text x="615" y="186" text-anchor="middle" dy=".35em" font-size="13" font-weight="normal" fill="#111111">At every factor the entries add</text>
<text x="615" y="204" text-anchor="middle" dy=".35em" font-size="13" font-weight="normal" fill="#111111">up to 0 (mod 3), so the five</text>
<text x="615" y="222" text-anchor="middle" dy=".35em" font-size="13" font-weight="normal" fill="#111111">vectors sum to the zero vector:</text>
<text x="615" y="240" text-anchor="middle" dy=".35em" font-size="13" font-weight="normal" fill="#111111">they are dependent over GF(3),</text>
<text x="615" y="258" text-anchor="middle" dy=".35em" font-size="13" font-weight="normal" fill="#111111">though independent over GF(2),</text>
<text x="615" y="276" text-anchor="middle" dy=".35em" font-size="13" font-weight="normal" fill="#111111">where every entry is 1.</text>
</svg>
