<text x="225.5" y="169.5" text-anchor="middle" dy=".35em" font-size="12" font-weight="normal" fill="#666666">5 | 10</text>
<text x="570" y="28" text-anchor="middle" dy=".35em" font-size="15" font-weight="bold" fill="#111111">Scheme B: 10:5, 15:3, 21:7, 14:2</text>
<text x="605.5" y="169.5" text-anchor="middle" dy=".35em" font-size="12" font-weight="normal" fill="#666666">5 | 15</text>
<text x="605.5" y="240.5" text-anchor="middle" dy=".35em" font-size="12" font-weight="normal" fill="#666666">3 | 21</text>
<text x="534.5" y="240.5" text-anchor="middle" dy=".35em" font-size="12" font-weight="normal" fill="#666666">7 | 14</text>
<text x="534.5" y="169.5" text-anchor="middle" dy=".35em" font-size="12" font-weight="normal" fill="#666666">2 | 10</text>
<text x="380" y="352" text-anchor="middle" dy=".35em" font-size="13" font-weight="normal" fill="#111111">Thick arrow: the prime that a number pays with.</text>
<text x="380" y="370" text-anchor="middle" dy=".35em" font-size="13" font-weight="normal" fill="#111111">Dashed arrow a → b: a is played before b, since a&#x27;s payment divides b</text>
<text x="380" y="388" text-anchor="middle" dy=".35em" font-size="13" font-weight="normal" fill="#111111">(the label 2 | 14 says that 2 divides 14).</text>
<text x="380" y="406" text-anchor="middle" dy=".35em" font-size="13" font-weight="normal" fill="#111111">In each scheme the dashed arrows form a cycle, so no order of play exists.</text>
