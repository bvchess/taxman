<text x="190" y="28" text-anchor="middle" dy=".35em" font-size="15" font-weight="bold" fill="#111111">Scheme A: 10:2, 14:7, 21:3, 15:5</text>
<text x="154.5" y="169.5" text-anchor="middle" dy=".35em" font-size="12" font-weight="normal" fill="#666666">2 | 14</text>
<text x="154.5" y="240.5" text-anchor="middle" dy=".35em" font-size="12" font-weight="normal" fill="#666666">7 | 21</text>
