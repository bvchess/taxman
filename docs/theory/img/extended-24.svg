<text x="590" y="262" text-anchor="middle" dy=".35em" font-size="14" font-weight="bold" fill="#111111">8 and 12 both need 4: unplayable</text>
<text x="390" y="330" text-anchor="middle" dy=".35em" font-size="12" font-weight="normal" fill="#666666">Double outline: 8 and 12, promoted into frame 1 from frame 2.  In frame 1, 8 lists 4 and 12 lists 6, 4.</text>
<text x="390" y="348" text-anchor="middle" dy=".35em" font-size="12" font-weight="normal" fill="#666666">The claim (18, 6), light dashed pair, takes 18 and 6 out first, which leaves 8 and 12 one factor, 4.</text>
<text x="390" y="366" text-anchor="middle" dy=".35em" font-size="12" font-weight="normal" fill="#666666">The promotion set {8, 12} would be lost, though 8 and 12 with the rest of the set are playable.</text>
