<text x="390" y="22" text-anchor="middle" dy=".35em" font-size="15" font-weight="bold" fill="#111111">T and 6137: two minimal cores</text>
<text x="390" y="51" text-anchor="middle" dy=".35em" font-size="12" font-weight="normal" fill="#666666">ground</text>
<text x="390" y="364" text-anchor="middle" dy=".35em" font-size="13" font-weight="normal" fill="#666666">Both cores hold d = 6137, 6647, 7429 and 8303.  Long dashes: the core with 4913.  Dots: with 5491.</text>
<text x="390" y="382" text-anchor="middle" dy=".35em" font-size="13" font-weight="normal" fill="#666666">Removing 6137 breaks both cores; removing 4913 or 5491 leaves the other.</text>
<text x="576" y="190" text-anchor="middle" dy=".35em" font-size="15" font-weight="bold" fill="#111111">d</text>
<text x="390" y="438" text-anchor="middle" dy=".35em" font-size="15" font-weight="bold" fill="#111111">With 6859 added: the core {5491, 6647, 6859, 7429, 8303}</text>
<text x="390" y="467" text-anchor="middle" dy=".35em" font-size="12" font-weight="normal" fill="#666666">ground</text>
<text x="390" y="780" text-anchor="middle" dy=".35em" font-size="13" font-weight="normal" fill="#666666">6859 = 19³ lies above 6137 and descending greedy keeps it, so a set that agrees with U* above 6137</text>
<text x="390" y="798" text-anchor="middle" dy=".35em" font-size="13" font-weight="normal" fill="#666666">cannot hold 5491, and the second core of the first panel is out of its reach.</text>
<text x="390" y="822" text-anchor="middle" dy=".35em" font-size="12" font-weight="normal" fill="#666666">Circles: sources, each joined to its maximal factors (squares).  Thick: in a core.  Hollow: outside it.</text>
