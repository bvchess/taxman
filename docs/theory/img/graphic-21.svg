<svg xmlns="http://www.w3.org/2000/svg" width="760" height="400" viewBox="0 0 760 400" font-family="Helvetica, Arial, sans-serif" font-size="14">
<title>The numbers 6, 10, 14, 15 and 21 as edges on the primes 2, 3, 5 and 7: the scan from the heaviest keeps 21, 15 and 14 and rejects 10 and 6, which would each close a cycle.</title>
<rect x="0" y="0" width="760" height="400" fill="#ffffff"/>
<line x1="85.5" y1="90" x2="156.5" y2="90" stroke="#666666" stroke-width="1.5" fill="none" stroke-dasharray="6 4"/>
<line x1="193.5" y1="90" x2="264.5" y2="90" stroke="#666666" stroke-width="1.5" fill="none" stroke-dasharray="6 4"/>
<line x1="280" y1="105.5" x2="280" y2="176.5" stroke="#111111" stroke-width="3.6" fill="none"/>
<line x1="280" y1="213.5" x2="280" y2="284.5" stroke="#111111" stroke-width="3.6" fill="none"/>
<line x1="264.5" y1="300" x2="193.5" y2="300" stroke="#111111" stroke-width="3.6" fill="none"/>
<line x1="156.5" y1="300" x2="85.5" y2="300" stroke="#111111" stroke-width="3.6" fill="none"/>
<line x1="70" y1="284.5" x2="70" y2="213.5" stroke="#111111" stroke-width="3.6" fill="none"/>
<line x1="70" y1="176.5" x2="70" y2="105.5" stroke="#111111" stroke-width="3.6" fill="none"/>
<line x1="85.1" y1="105.1" x2="161.9" y2="181.9" stroke="#666666" stroke-width="1.5" fill="none" stroke-dasharray="6 4"/>
<line x1="188.1" y1="208.1" x2="264.9" y2="284.9" stroke="#666666" stroke-width="1.5" fill="none" stroke-dasharray="6 4"/>
<rect x="56" y="76" width="28" height="28" fill="#ffffff" stroke="#111111" stroke-width="1.7"/>
<text x="70" y="90" text-anchor="middle" dy=".35em" font-size="14" font-weight="normal" fill="#111111">2</text>
<rect x="266" y="76" width="28" height="28" fill="#ffffff" stroke="#111111" stroke-width="1.7"/>
<text x="280" y="90" text-anchor="middle" dy=".35em" font-size="14" font-weight="normal" fill="#111111">5</text>
<rect x="266" y="286" width="28" height="28" fill="#ffffff" stroke="#111111" stroke-width="1.7"/>
<text x="280" y="300" text-anchor="middle" dy=".35em" font-size="14" font-weight="normal" fill="#111111">3</text>
<rect x="56" y="286" width="28" height="28" fill="#ffffff" stroke="#111111" stroke-width="1.7"/>
<text x="70" y="300" text-anchor="middle" dy=".35em" font-size="14" font-weight="normal" fill="#111111">7</text>
<circle cx="175" cy="90" r="17" fill="#ffffff" stroke="#111111" stroke-width="1.7" stroke-dasharray="4 3"/>
<text x="175" y="90" text-anchor="middle" dy=".35em" font-size="14" font-weight="normal" fill="#111111">10</text>
<circle cx="280" cy="195" r="17" fill="#cdcdcd" stroke="#111111" stroke-width="1.7"/>
<text x="280" y="195" text-anchor="middle" dy=".35em" font-size="14" font-weight="normal" fill="#111111">15</text>
<circle cx="175" cy="300" r="17" fill="#cdcdcd" stroke="#111111" stroke-width="1.7"/>
<text x="175" y="300" text-anchor="middle" dy=".35em" font-size="14" font-weight="normal" fill="#111111">21</text>
<circle cx="70" cy="195" r="17" fill="#cdcdcd" stroke="#111111" stroke-width="1.7"/>
<text x="70" y="195" text-anchor="middle" dy=".35em" font-size="14" font-weight="normal" fill="#111111">14</text>
<circle cx="175" cy="195" r="17" fill="#ffffff" stroke="#111111" stroke-width="1.7" stroke-dasharray="4 3"/>
<text x="175" y="195" text-anchor="middle" dy=".35em" font-size="14" font-weight="normal" fill="#111111">6</text>
<circle cx="412" cy="78" r="16" fill="#cdcdcd" stroke="#111111" stroke-width="1.7"/>
<text x="412" y="78" text-anchor="middle" dy=".35em" font-size="14" font-weight="normal" fill="#111111">21</text>
<circle cx="412" cy="130" r="16" fill="#cdcdcd" stroke="#111111" stroke-width="1.7"/>
<text x="412" y="130" text-anchor="middle" dy=".35em" font-size="14" font-weight="normal" fill="#111111">15</text>
<circle cx="412" cy="182" r="16" fill="#cdcdcd" stroke="#111111" stroke-width="1.7"/>
<text x="412" y="182" text-anchor="middle" dy=".35em" font-size="14" font-weight="normal" fill="#111111">14</text>
<circle cx="412" cy="234" r="16" fill="#ffffff" stroke="#111111" stroke-width="1.7" stroke-dasharray="4 3"/>
<text x="412" y="234" text-anchor="middle" dy=".35em" font-size="14" font-weight="normal" fill="#111111">10</text>
<circle cx="412" cy="286" r="16" fill="#ffffff" stroke="#111111" stroke-width="1.7" stroke-dasharray="4 3"/>
<text x="412" y="286" text-anchor="middle" dy=".35em" font-size="14" font-weight="normal" fill="#111111">6</text>
<text x="175" y="30" text-anchor="middle" dy=".35em" font-size="15" font-weight="bold" fill="#111111">The edges, and what the scan keeps</text>
<text x="392" y="30" text-anchor="start" dy=".35em" font-size="15" font-weight="bold" fill="#111111">The scan, from the heaviest</text>
<text x="444" y="78" text-anchor="start" dy=".35em" font-size="14" font-weight="bold" fill="#111111">keep</text>
<text x="500" y="78" text-anchor="start" dy=".35em" font-size="13" font-weight="normal" fill="#666666">3–7</text>
<text x="444" y="130" text-anchor="start" dy=".35em" font-size="14" font-weight="bold" fill="#111111">keep</text>
<text x="500" y="130" text-anchor="start" dy=".35em" font-size="13" font-weight="normal" fill="#666666">3–5</text>
<text x="444" y="182" text-anchor="start" dy=".35em" font-size="14" font-weight="bold" fill="#111111">keep</text>
<text x="500" y="182" text-anchor="start" dy=".35em" font-size="13" font-weight="normal" fill="#666666">2–7</text>
<text x="444" y="234" text-anchor="start" dy=".35em" font-size="14" font-weight="normal" fill="#111111">reject</text>
<text x="500" y="234" text-anchor="start" dy=".35em" font-size="13" font-weight="normal" fill="#666666">closes the cycle 10, 14, 15, 21</text>
<text x="444" y="286" text-anchor="start" dy=".35em" font-size="14" font-weight="normal" fill="#111111">reject</text>
<text x="500" y="286" text-anchor="start" dy=".35em" font-size="13" font-weight="normal" fill="#666666">closes the triangle 6, 14, 21</text>
<text x="392" y="348" text-anchor="start" dy=".35em" font-size="13" font-weight="normal" fill="#111111">Kept: 21 + 15 + 14 = 50, the heaviest</text>
<text x="392" y="366" text-anchor="start" dy=".35em" font-size="13" font-weight="normal" fill="#111111">of the 8 bases.</text>
</svg>
