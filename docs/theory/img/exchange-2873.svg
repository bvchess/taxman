<text x="390" y="22" text-anchor="middle" dy=".35em" font-size="15" font-weight="bold" fill="#111111">A = {1573, 2057, 2431, 2873}: playable, stuck at four</text>
<text x="610" y="51" text-anchor="middle" dy=".35em" font-size="12" font-weight="normal" fill="#666666">ground</text>
<text x="390" y="268" text-anchor="middle" dy=".35em" font-size="13" font-weight="normal" fill="#666666">1859 would make the core {1573, 1859, 2057, 2431, 2873}, and 2197 would make a core by itself:</text>
<text x="390" y="286" text-anchor="middle" dy=".35em" font-size="13" font-weight="normal" fill="#666666">no member of B fits into A.</text>
<text x="390" y="342" text-anchor="middle" dy=".35em" font-size="15" font-weight="bold" fill="#111111">B = {1573, 1859, 2057, 2197, 2873}: playable, with five</text>
<text x="610" y="371" text-anchor="middle" dy=".35em" font-size="12" font-weight="normal" fill="#666666">ground</text>
<text x="390" y="588" text-anchor="middle" dy=".35em" font-size="13" font-weight="normal" fill="#666666">So the playable sets are not the independent sets of a matroid:</text>
<text x="390" y="606" text-anchor="middle" dy=".35em" font-size="13" font-weight="normal" fill="#666666">one maximal set has four members and another five.</text>
<text x="390" y="646" text-anchor="middle" dy=".35em" font-size="12" font-weight="normal" fill="#666666">Circles: sources, each joined to its maximal factors (squares).  Solid: in the set.  Dashed: not in it.</text>
