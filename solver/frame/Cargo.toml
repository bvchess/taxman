[package]
name = "taxman"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
description = "Solver for the game of Taxman"
publish = false

[lib]
name = "taxman"
path = "src/lib.rs"

[[bin]]
name = "taxman"
path = "src/main.rs"

# The ledger has tests of its own (its relations bracket the optimum, its runs prove at the optimum), which `cargo test`
# runs; no other example has any.
[[example]]
name = "ledger"
test = true

[dependencies]
# The decoder of the results file, results/optimal.jsonl.gz, which the binary has built in; the prover reads it with the
# same crate.
taxman-gzip = { path = "../gzip" }

[profile.release]
lto = "fat"
codegen-units = 1
# Keep symbols so profilers (samply, Instruments) can attribute time to functions.
debug = 1
panic = "abort"

# Tests replay real games, so give them an optimizer.
[profile.test]
opt-level = 2
