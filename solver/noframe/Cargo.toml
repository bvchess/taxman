[package]
name = "taxman-prover"
version = "0.1.0"
edition = "2021"
description = "Independent proofs and checks of the Taxman solver's results"
publish = false

# Its own workspace: this crate shares no proof code with the frame solver in ../frame (independence is the point).
# The two programs share only the gzip decoder in ../gzip, which reads the committed chain.
[workspace]

[dependencies]
taxman-gzip = { path = "../gzip" }

[profile.release]
lto = "fat"
codegen-units = 1
debug = 1
panic = "abort"

[profile.test]
opt-level = 2
