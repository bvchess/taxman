[package]
name = "taxman"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
description = "Solver for the game of Taxman"
publish = false

[lib]
name = "taxman"
path = "src/lib.rs"

[[bin]]
name = "taxman"
path = "src/main.rs"

# The tuning benchmark's solver has tests of its own (units are solved the same every time; a root unit is the
# whole search), and so has the wall study's landscape (the ends of a game are what `solve` starts from and finds, and
# its output file resumes), which `cargo test` runs; no other example has any.
[[example]]
name = "tune"
test = true

[[example]]
name = "wall"
test = true

[dependencies]

[profile.release]
lto = "fat"
codegen-units = 1
# Keep symbols so profilers (samply, Instruments) can attribute time to functions.
debug = 1
panic = "abort"

# Tests replay real games, so give them an optimizer.
[profile.test]
opt-level = 2
