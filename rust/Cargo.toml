[package]
name = "taxman"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
description = "Solver for the game of Taxman"
publish = false

[lib]
name = "taxman"
path = "src/lib.rs"

[[bin]]
name = "taxman"
path = "src/main.rs"

[features]
# The study tools: the examples `tune`, `extended`, `structure` and `wall`, which the occasional studies use.  A default
# build, `cargo test`, `cargo clippy --all-targets` and the cloud setup skip them; `--features studies` builds them (and
# `cargo test --features studies` runs their tests).  The examples `ledger`, `perf` and `ladder` are in every build.
studies = []

# The tuning benchmark's solver has tests of its own (units are solved the same every time; a root unit is the
# whole search), and so have the wall study (the landscape's ends are what `solve` starts from and finds and its output
# file resumes, the root bound is the first node's, the node-choice measurement's bounds are valid and it resumes),
# which `cargo test --features studies` runs, and the ledger (its relations bracket the optimum, its runs prove at the
# optimum), which `cargo test` runs; no other example has any.
[[example]]
name = "tune"
test = true
required-features = ["studies"]

[[example]]
name = "wall"
test = true
required-features = ["studies"]

[[example]]
name = "extended"
required-features = ["studies"]

[[example]]
name = "structure"
required-features = ["studies"]

[[example]]
name = "ledger"
test = true

[dependencies]

[profile.release]
lto = "fat"
codegen-units = 1
# Keep symbols so profilers (samply, Instruments) can attribute time to functions.
debug = 1
panic = "abort"

# Tests replay real games, so give them an optimizer.
[profile.test]
opt-level = 2
