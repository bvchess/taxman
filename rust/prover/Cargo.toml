[package]
name = "taxman-prover"
version = "0.1.0"
edition = "2021"
description = "Independent proofs and checks of the Taxman solver's results"
publish = false

# Its own workspace: this crate shares no code with the solver in ../ (independence is the point).
[workspace]

[dependencies]

[profile.release]
lto = "fat"
codegen-units = 1
debug = 1
panic = "abort"

[profile.test]
opt-level = 2
